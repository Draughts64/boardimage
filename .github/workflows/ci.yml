name: CI
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: boardimage-linux
          path: target/release/boardimage

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: boardimage:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            src: boardimage
            asset: boardimage-linux-amd64
          - os: windows-latest
            src: boardimage.exe
            asset: boardimage-windows-amd64.exe
          - os: macos-latest
            src: boardimage
            asset: boardimage-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: cp "target/release/${{ matrix.src }}" "${{ matrix.asset }}"
        shell: bash
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
          generate_release_notes: true
