[package]
name = "boardimage"
version = "0.1.0"
edition = "2021"
description = "Draughts board rendering service + CLI: PNG/WebP/SVG images and GIF replays (PDN variants, per-square notation, themes)"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Draughts64/boardimage"

[lib]
name = "boardimage"
path = "src/lib.rs"

[dependencies]
tiny-skia = "0.11"
gifski = { version = "1", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
imgref = "1"
rgb = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webp = "0.3"

[profile.release]
lto = true
strip = true
